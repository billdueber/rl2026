<!doctype html><html lang=en-US><head><meta charset=utf-8><title>MARC-HASH control field, now with less structure | Robot Librarian</title></head><body><main class=site-main><article class=page><h1 class=page-title>MARC-HASH control field, now with less structure</h1><div class=post-content><div class=paragraph><p>Why do I ever, ever think that MARC might not rely on order? I don’t know.</p></div><div class=paragraph><p>In any case, control fields will now be just an array of duples:</p></div><div class=listingblock><div class=content><pre class=highlight><code class=language-javascript data-lang=javascript> control: [   [&#39;001&#39;, &#39;value of the 001&#39;],   [&#39;006&#39;, &#39;value of the 006&#39;]   [&#39;006&#39;, &#39;another 006&#39;] }</code></pre></div></div></div></article></main></body></html>
