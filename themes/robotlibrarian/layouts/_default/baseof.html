<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body hx-boost="true" hx-select=".site-main" hx-target=".site-main" hx-swap="outerHTML">
  {{- partial "header.html" . -}}
  <div class="site-body">
    <div class="container content-grid">
      <main class="site-main">
        {{- block "main" . }}{{ end -}}
      </main>
      {{- partial "sidebar.html" . -}}
    </div>
  </div>
  {{- partial "footer.html" . -}}
</body>
</html>
