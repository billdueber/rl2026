<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body hx-boost="true" hx-select=".site-main" hx-target=".site-main" hx-swap="outerHTML">
  {{- partial "header.html" . -}}
  <main class="site-main">
    <div class="container">
      {{- block "main" . }}{{ end -}}
    </div>
  </main>
  {{- partial "footer.html" . -}}
</body>
</html>
