<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body hx-boost:inherited="true transition:true"
      hx-target:inherited=".site-main"
      hx-swap:inherited="outerMorph">
  {{- partial "header.html" . -}}
  <div class="site-body">
    <div class="container content-grid">
      <main class="site-main">
        {{- block "main" . }}{{ end -}}
      </main>
      {{- partial "sidebar.html" . -}}
    </div>
  </div>
  {{- partial "footer.html" . -}}
</body>
</html>
