<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
{{- if .IsHome }}
<title>{{ .Site.Title }} &ndash; {{ .Site.Params.tagline }}</title>
{{- else }}
<title>{{ .Title }} | {{ .Site.Title }}</title>
{{- end }}
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else if .IsHome }}{{ .Site.Params.tagline }}{{ else }}{{ .Summary }}{{ end }}" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ "css/style.css" | relURL }}" />
<script src="{{ "js/htmx.min.js" | relURL }}" defer></script>
{{ with .OutputFormats.Get "RSS" }}<link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .RelPermalink }}" />{{ end }}
