{{ if gt .Paginator.TotalPages 1 }}
  <nav class="pagination" aria-label="Pagination">
    {{ if .Paginator.HasPrev }}<a class="page-link" href="{{ .Paginator.Prev.URL }}">&larr; Newer</a>{{ end }}
    <span class="page-info">Page {{ .Paginator.PageNumber }} of {{ .Paginator.TotalPages }}</span>
    {{ if .Paginator.HasNext }}<a class="page-link" href="{{ .Paginator.Next.URL }}">Older &rarr;</a>{{ end }}
  </nav>
{{ end }}
