<header class="site-header">
  <div class="container header-inner">
    <div class="brand">
      <a class="brand-link" href="{{ "/" | relURL }}">
        <img class="site-logo" src="{{ "/images/robot_alpha.png" | relURL }}" alt="" width="29" height="33" />
        <span class="brand-text">
          <span class="site-title">{{ .Site.Title }}</span>
          {{ with .Site.Params.tagline }}<span class="tagline">{{ . }}</span>{{ end }}
        </span>
      </a>
    </div>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ "/" | relURL }}">Home</a>
      <a href="{{ "/about-bill/" | relURL }}">About</a>
      <a href="{{ "/tags/" | relURL }}">Tags</a>
    </nav>
  </div>
</header>
