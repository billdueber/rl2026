name: Verify Build

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'

      - name: Generate month archives
        run: bundle exec ruby bin/generate_month_archives.rb

      - name: Build site
        run: hugo --minify
