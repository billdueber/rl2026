name: Build and Commit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'

      - name: Generate month archives
        run: bundle exec ruby bin/generate_month_archives.rb

      - name: Commit month archive changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/archive/
          if git diff --cached --quiet; then
            echo "No archive changes to commit"
          else
            git commit -m "chore: update month archive stubs [skip ci]"
            git push
          fi

      - name: Build site
        run: hugo --minify

      - name: Deploy to build branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: build
          force_orphan: true
